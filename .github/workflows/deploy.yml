name: Cloudflare Pages Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          #cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Install Dependencies2
        run: npm ci
      - name: Dependencies Control
        run: npm audit fix

      - name: Build Project
        run: npm run build
